<!-- THROWAWAY PROTOTYPE: three contextual agent sidebar layouts beside Library, with simulated actions. -->
<div id="agent-sidebar-prototype">
  <style>
    #agent-sidebar-prototype {
      --gf-page: light-dark(#fff, #000);
      --gf-plane: light-dark(#f5f5f5, #0a0a0a);
      --gf-fill: light-dark(#ededed, #161616);
      --gf-hover: light-dark(#e5e5e5, #252525);
      --gf-edge: light-dark(#dedede, #292929);
      --gf-text: light-dark(#171717, #ededed);
      --gf-secondary: light-dark(#606060, #a1a1a1);
      --gf-invert: light-dark(#fff, #0a0a0a);
      --gf-action-radius: 4px;
      font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      color: var(--gf-text);
      width: 100%;
    }
    #agent-sidebar-prototype * { box-sizing: border-box; }
    #agent-sidebar-prototype [hidden] { display: none !important; }
    #agent-sidebar-prototype button, #agent-sidebar-prototype input, #agent-sidebar-prototype textarea, #agent-sidebar-prototype select { font: inherit; }
    #agent-sidebar-prototype button { color: inherit; cursor: inherit; }
    #agent-sidebar-prototype button:focus-visible, #agent-sidebar-prototype textarea:focus-visible, #agent-sidebar-prototype select:focus-visible { outline: 2px solid var(--gf-text); outline-offset: 3px; }
    #agent-sidebar-prototype button { -webkit-tap-highlight-color: transparent; }
    #agent-sidebar-prototype .gf-window { background: var(--gf-plane); border: 1px solid var(--gf-edge); border-radius: 10px; overflow: clip; }
    #agent-sidebar-prototype .gf-top { min-height: 54px; display: flex; align-items: center; padding: 0 18px; gap: 17px; border-bottom: 1px solid var(--gf-edge); }
    #agent-sidebar-prototype .gf-mark { font-size: 22px; font-weight: 700; letter-spacing: -2px; }
    #agent-sidebar-prototype .gf-brand { font-weight: 500; }
    #agent-sidebar-prototype .gf-crumb { color: var(--gf-secondary); font-size: 12px; }
    #agent-sidebar-prototype .gf-demo { margin-left: auto; color: var(--gf-secondary); font-size: 11px; letter-spacing: .07em; text-transform: uppercase; padding-right: 85px; }
    #agent-sidebar-prototype .gf-workspace { display: grid; grid-template-columns: 135px minmax(0,1fr) minmax(315px,36%); min-height: 660px; }
    #agent-sidebar-prototype .gf-nav { border-right: 1px solid var(--gf-edge); padding: 24px 10px; }
    #agent-sidebar-prototype .gf-nav-label { font-size: 11px; letter-spacing: .1em; color: var(--gf-secondary); margin: 22px 10px 9px; }
    #agent-sidebar-prototype .gf-nav-item { padding: 9px 10px; color: var(--gf-secondary); font-size: 12px; }
    #agent-sidebar-prototype .gf-nav-item.is-active { background: var(--gf-hover); color: var(--gf-text); border-radius: 4px; }
    #agent-sidebar-prototype .gf-library { background: var(--gf-page); padding: 23px 22px; min-width: 0; }
    #agent-sidebar-prototype .gf-library-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
    #agent-sidebar-prototype h2, #agent-sidebar-prototype h3, #agent-sidebar-prototype p { margin: 0; }
    #agent-sidebar-prototype .gf-library h2 { font-size: 19px; letter-spacing: -.4px; font-weight: 500; }
    #agent-sidebar-prototype .gf-hint { font-size: 12px; color: var(--gf-secondary); margin-bottom: 24px; }
    #agent-sidebar-prototype .gf-count { font-size: 12px; color: var(--gf-secondary); min-height: 32px; display: flex; align-items: center; gap: 9px; }
    #agent-sidebar-prototype .gf-link { background: none; border: 0; padding: 5px 0; font-size: 12px; color: var(--gf-secondary); text-decoration: underline; text-underline-offset: 3px; }
    #agent-sidebar-prototype .gf-gallery { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 19px 12px; }
    #agent-sidebar-prototype .gf-asset { background: none; border: 0; padding: 0; text-align: left; min-width: 0; }
    #agent-sidebar-prototype .gf-thumb { display: block; position: relative; width: 100%; aspect-ratio: 1.06; background-color: var(--gf-fill); background-size: 420% auto; background-position-y: 48%; border-radius: 5px; }
    #agent-sidebar-prototype .gf-asset[aria-pressed=true] .gf-thumb { outline: 2px solid var(--gf-text); outline-offset: 3px; }
    #agent-sidebar-prototype .gf-check { position: absolute; top: 8px; left: 8px; display: grid; place-items: center; width: 21px; height: 21px; font-size: 12px; background: var(--gf-text); color: var(--gf-invert); border-radius: 3px; }
    #agent-sidebar-prototype .gf-duration { position: absolute; bottom: 7px; right: 7px; padding: 2px 5px; font-size: 11px; background: #0a0a0a; color: #ededed; border-radius: 3px; }
    #agent-sidebar-prototype .gf-asset-title { display: block; font-size: 12px; margin-top: 9px; overflow-wrap: anywhere; }
    #agent-sidebar-prototype .gf-asset-meta { display: block; font-size: 11px; color: var(--gf-secondary); margin-top: 2px; }
    #agent-sidebar-prototype .gf-agent { display: flex; flex-direction: column; background: var(--gf-plane); border-left: 1px solid var(--gf-edge); min-width: 0; }
    #agent-sidebar-prototype .gf-agent-head { min-height: 49px; padding: 8px 15px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--gf-edge); }
    #agent-sidebar-prototype .gf-agent-head strong { font-size: 13px; font-weight: 500; margin-right: auto; }
    #agent-sidebar-prototype .gf-quiet { background: transparent; border: 0; padding: 7px 5px; color: var(--gf-secondary); border-radius: 4px; font-size: 11px; white-space: nowrap; }
    #agent-sidebar-prototype .gf-quiet:hover, #agent-sidebar-prototype .gf-quiet[aria-expanded=true] { background: var(--gf-hover); color: var(--gf-text); }
    #agent-sidebar-prototype .gf-tabs { display: flex; border-bottom: 1px solid var(--gf-edge); padding: 0 16px; gap: 22px; }
    #agent-sidebar-prototype .gf-tab { min-height: 42px; padding: 0; background: transparent; border: 0; border-bottom: 2px solid transparent; color: var(--gf-secondary); font-size: 12px; }
    #agent-sidebar-prototype .gf-tab[aria-selected=true] { border-bottom-color: var(--gf-text); color: var(--gf-text); }
    #agent-sidebar-prototype .gf-tab small { margin-left: 4px; color: var(--gf-secondary); font-size: 11px; }
    #agent-sidebar-prototype .gf-pane { padding: 22px 18px; flex: 1; min-width: 0; }
    #agent-sidebar-prototype .gf-eyebrow { font-size: 11px; color: var(--gf-secondary); margin-bottom: 9px; }
    #agent-sidebar-prototype .gf-pane h3 { font-size: 20px; line-height: 1.25; font-weight: 500; letter-spacing: -.5px; margin-bottom: 9px; }
    #agent-sidebar-prototype .gf-support { color: var(--gf-secondary); font-size: 12px; line-height: 1.6; margin-bottom: 22px; }
    #agent-sidebar-prototype .gf-context-strip { display: flex; align-items: center; justify-content: space-between; gap: 10px; font-size: 11px; padding: 10px 18px; border-bottom: 1px solid var(--gf-edge); }
    #agent-sidebar-prototype .gf-context-strip span { min-width: 0; overflow-wrap: anywhere; }
    #agent-sidebar-prototype .gf-actions { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 8px; }
    #agent-sidebar-prototype .gf-action { min-height: 94px; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start; background: transparent; border: 1px solid var(--gf-edge); padding: 12px; border-radius: var(--gf-action-radius); text-align: left; gap: 8px; }
    #agent-sidebar-prototype .gf-action:hover { border-color: var(--gf-secondary); background: var(--gf-fill); }
    #agent-sidebar-prototype .gf-action strong { font-size: 12px; font-weight: 500; }
    #agent-sidebar-prototype .gf-action span { font-size: 11px; color: var(--gf-secondary); }
    #agent-sidebar-prototype .gf-agent-foot { padding: 0 14px 14px; }
    #agent-sidebar-prototype .gf-input-context { font-size: 11px; color: var(--gf-secondary); padding: 8px 2px; display: flex; align-items: center; gap: 6px; }
    #agent-sidebar-prototype .gf-compose { border: 1px solid var(--gf-edge); border-radius: 5px; padding: 11px; background: var(--gf-page); }
    #agent-sidebar-prototype .gf-compose textarea { width: 100%; min-height: 52px; resize: vertical; color: var(--gf-text); background: transparent; border: 0; padding: 0; font-size: 13px; outline-offset: 5px; }
    #agent-sidebar-prototype .gf-compose textarea::placeholder { color: var(--gf-secondary); }
    #agent-sidebar-prototype .gf-compose-row { display: flex; align-items: center; gap: 7px; padding-top: 8px; }
    #agent-sidebar-prototype .gf-send { margin-left: auto; border: 0; border-radius: 4px; background: var(--gf-text); color: var(--gf-invert); font-size: 12px; padding: 7px 13px; font-weight: 500; }
    #agent-sidebar-prototype .gf-send:disabled { opacity: .35; }
    #agent-sidebar-prototype .gf-more-wrap { position: relative; }
    #agent-sidebar-prototype .gf-menu { position: absolute; bottom: 36px; left: 0; min-width: 190px; padding: 9px; border: 1px solid var(--gf-edge); background: var(--gf-plane); border-radius: 5px; z-index: 5; }
    #agent-sidebar-prototype .gf-menu label { font-size: 11px; display: block; color: var(--gf-secondary); }
    #agent-sidebar-prototype .gf-menu select { margin-top: 5px; width: 100%; background: var(--gf-fill); border: 1px solid var(--gf-edge); border-radius: 3px; padding: 6px; color: var(--gf-text); font-size: 12px; }
    #agent-sidebar-prototype .gf-menu button { display: block; border: 0; width: 100%; text-align: left; background: none; padding: 8px 4px; font-size: 12px; }
    #agent-sidebar-prototype .gf-state { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 11px 6px 5px; color: var(--gf-secondary); font-size: 11px; }
    #agent-sidebar-prototype .gf-state span:first-child { margin-right: auto; }
    #agent-sidebar-prototype .gf-row { display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--gf-edge); padding: 12px 0; min-width: 0; }
    #agent-sidebar-prototype .gf-row-text { min-width: 0; flex: 1; }
    #agent-sidebar-prototype .gf-row-text strong { display: block; font-weight: 500; font-size: 12px; }
    #agent-sidebar-prototype .gf-row-text span { display: block; margin-top: 3px; font-size: 11px; color: var(--gf-secondary); }
    #agent-sidebar-prototype .gf-mini { width: 39px; height: 39px; flex: 0 0 39px; background-size: 420% auto; background-position-y: 48%; border-radius: 3px; }
    #agent-sidebar-prototype .gf-section-label { color: var(--gf-secondary); font-size: 11px; letter-spacing: .04em; margin-top: 24px; margin-bottom: 3px; }
    #agent-sidebar-prototype .gf-chats { width: 100%; text-align: left; background: none; border: 0; border-bottom: 1px solid var(--gf-edge); padding: 15px 0; }
    #agent-sidebar-prototype .gf-chats strong { font-weight: 500; font-size: 13px; display: block; }
    #agent-sidebar-prototype .gf-chats span { display: block; color: var(--gf-secondary); font-size: 11px; margin-top: 4px; }
    #agent-sidebar-prototype .gf-transcript { display: flex; flex-direction: column; gap: 20px; }
    #agent-sidebar-prototype .gf-message strong { font-size: 11px; font-weight: 500; display: block; margin-bottom: 7px; }
    #agent-sidebar-prototype .gf-message p { font-size: 13px; line-height: 1.65; white-space: pre-line; overflow-wrap: anywhere; }
    #agent-sidebar-prototype .gf-user { border: 1px solid var(--gf-edge); padding: 12px; border-radius: 5px; }
    #agent-sidebar-prototype .gf-message-context { font-size: 11px; color: var(--gf-secondary); margin-top: 9px; }
    #agent-sidebar-prototype .gf-response-actions { margin-top: 12px; display: flex; gap: 12px; flex-wrap: wrap; }
    #agent-sidebar-prototype .gf-thread-title { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 21px; font-size: 11px; color: var(--gf-secondary); }
    #agent-sidebar-prototype .gf-inspector .gf-agent-head { min-height: 49px; }
    #agent-sidebar-prototype .gf-inspector .gf-pane { padding-top: 17px; }
    #agent-sidebar-prototype .gf-inspector-preview { height: 136px; border-radius: 4px; background-size: 330% auto; background-position-y: 50%; margin-bottom: 15px; }
    #agent-sidebar-prototype .gf-inspector .gf-pane h3 { font-size: 16px; }
    #agent-sidebar-prototype .gf-command { display: flex; align-items: center; justify-content: space-between; width: 100%; background: none; border: 0; border-bottom: 1px solid var(--gf-edge); padding: 12px 0; text-align: left; font-size: 12px; gap: 10px; }
    #agent-sidebar-prototype .gf-command:hover { color: var(--gf-secondary); }
    #agent-sidebar-prototype .gf-command span { color: var(--gf-secondary); font-size: 12px; }
    #agent-sidebar-prototype .gf-inline-history { margin-top: 24px; }
    #agent-sidebar-prototype .gf-thread-tabs { padding: 8px 10px 0; display: flex; gap: 5px; border-bottom: 1px solid var(--gf-edge); }
    #agent-sidebar-prototype .gf-thread-tab { text-align: left; padding: 9px 9px; border: 1px solid var(--gf-edge); border-bottom: 0; border-radius: 4px 4px 0 0; font-size: 11px; background: var(--gf-fill); }
    #agent-sidebar-prototype .gf-thread-tab[aria-selected=false] { background: transparent; color: var(--gf-secondary); }
    #agent-sidebar-prototype .gf-thread-tabs .gf-quiet { margin-left: auto; }
    #agent-sidebar-prototype .gf-conversation .gf-pane { display: flex; flex-direction: column; }
    #agent-sidebar-prototype .gf-conversation .gf-intro { padding: 15px 0 22px; }
    #agent-sidebar-prototype .gf-conversation .gf-intro h3 { font-size: 19px; }
    #agent-sidebar-prototype .gf-conversation .gf-actions { display: block; }
    #agent-sidebar-prototype .gf-conversation .gf-action { min-height: 0; width: 100%; flex-direction: row; align-items: center; border: 0; border-bottom: 1px solid var(--gf-edge); border-radius: 0; padding: 14px 0; }
    #agent-sidebar-prototype .gf-conversation .gf-action:hover { background: none; color: var(--gf-secondary); }
    #agent-sidebar-prototype .gf-no-agent { grid-template-columns: 135px minmax(0,1fr); }
    #agent-sidebar-prototype .gf-full { min-height: 660px; display: grid; grid-template-columns: 210px minmax(0,1fr); background: var(--gf-page); }
    #agent-sidebar-prototype .gf-full-sidebar { background: var(--gf-plane); border-right: 1px solid var(--gf-edge); padding: 22px 18px; }
    #agent-sidebar-prototype .gf-full-main { padding: 24px 30px; display: flex; flex-direction: column; }
    #agent-sidebar-prototype .gf-full-empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; padding: 45px 0; }
    #agent-sidebar-prototype .gf-full-empty h3 { font-size: 27px; font-weight: 500; letter-spacing: -.7px; }
    #agent-sidebar-prototype .gf-full-pills { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 10px; }
    #agent-sidebar-prototype .gf-full-pill { border: 1px solid var(--gf-edge); border-radius: 99px; padding: 10px 16px; color: var(--gf-secondary); font-size: 12px; }
    #agent-sidebar-prototype .gf-full .gf-compose { border-radius: 12px; }
    #agent-sidebar-prototype .gf-full .gf-compose textarea { min-height: 57px; }
    #agent-sidebar-prototype .gf-full-note { color: var(--gf-secondary); font-size: 11px; }
    @media (max-width: 880px) {
      #agent-sidebar-prototype .gf-workspace { grid-template-columns: minmax(0,1fr) minmax(310px,43%); }
      #agent-sidebar-prototype .gf-nav { display: none; }
      #agent-sidebar-prototype .gf-no-agent { grid-template-columns: 1fr; }
      #agent-sidebar-prototype .gf-demo { padding-right: 70px; }
    }
    @media (max-width: 590px) {
      #agent-sidebar-prototype .gf-top { padding: 12px; gap: 12px; flex-wrap: wrap; }
      #agent-sidebar-prototype .gf-crumb { display: none; }
      #agent-sidebar-prototype .gf-demo { padding-right: 80px; }
      #agent-sidebar-prototype .gf-workspace { grid-template-columns: 1fr; }
      #agent-sidebar-prototype .gf-library { padding: 18px; }
      #agent-sidebar-prototype .gf-gallery { grid-template-columns: repeat(3,minmax(0,1fr)); gap: 12px; }
      #agent-sidebar-prototype .gf-asset-title { font-size: 11px; }
      #agent-sidebar-prototype .gf-asset-meta { display: none; }
      #agent-sidebar-prototype .gf-agent { border-left: 0; border-top: 1px solid var(--gf-edge); min-height: 590px; }
      #agent-sidebar-prototype .gf-hint { margin-bottom: 13px; }
      #agent-sidebar-prototype .gf-full { grid-template-columns: 1fr; }
      #agent-sidebar-prototype .gf-full-sidebar { display: none; }
      #agent-sidebar-prototype .gf-full-main { padding: 20px; }
    }
    @media (pointer: coarse) {
      #agent-sidebar-prototype .gf-quiet, #agent-sidebar-prototype .gf-tab, #agent-sidebar-prototype .gf-link, #agent-sidebar-prototype .gf-send { min-height: 44px; }
      #agent-sidebar-prototype .gf-compose textarea { font-size: 16px; }
    }
  </style>

  <div class="viz-carousel" aria-label="Agent sidebar layouts">
    <section data-variant="Tabs" aria-label="Tabs layout"><div class="gf-mount"></div></section>
    <section data-variant="Context first" aria-label="Context first layout" hidden><div class="gf-mount"></div></section>
    <section data-variant="Conversation tabs" aria-label="Conversation tabs layout" hidden><div class="gf-mount"></div></section>
  </div>
  <script>
  (() => {
    const root = document.getElementById('agent-sidebar-prototype');
    const assets = [
      { id: 'craft', name: 'Crafting the story', type: 'Video', meta: '0:42 · Portrait', duration: '0:42', image: 'founder', pos: '4%' },
      { id: 'studio', name: 'Behind the scenes', type: 'Video', meta: '1:18 · Landscape', duration: '1:18', image: 'studio', pos: '4%' },
      { id: 'product', name: 'The finished piece', type: 'Image', meta: '2048 × 2048', image: 'founder', pos: '96%' },
      { id: 'detail', name: 'A closer look', type: 'Image', meta: '2048 × 2048', image: 'founder', pos: '50%' }
    ];
    const variants = [...root.querySelectorAll('[data-variant]')];
    const state = variants.map(() => ({ selected: ['craft'], tab: 'Chat', draft: '', messages: [], title: 'New conversation', mode: 'Auto', menu: '', closed: false, full: false, include: true, chat: 'new' }));
    const esc = value => String(value).replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
    const selectedAssets = s => assets.filter(asset => s.selected.includes(asset.id));
    const imageStyle = a => `background-image:var(--gf-${a.image}-image);background-position-x:${a.pos}`;
    function context(s) {
      const picked = selectedAssets(s);
      return !s.include || !picked.length ? 'Library · All assets' : picked.length === 1 ? picked[0].name : `${picked.length} selected assets`;
    }
    function actions(s) {
      const picked = s.include ? selectedAssets(s) : [];
      if (!picked.length) return [ ['Find an asset','Search your library'], ['Organize library','Group related content'], ['Review recent work','Find what needs attention'], ['Plan next steps','Work from your library'] ];
      if (picked.length > 1) return [ ['Draft posts','Use the selected assets'], ['Compare assets','Choose what works best'], ['Build a carousel','Turn a set into a story'], ['Organize selection','Move into a folder'] ];
      if (picked[0].type === 'Video') return [ ['Write a caption','For this video'], ['Create clips','Find moments to reuse'], ['Draft a post','Start from this video'], ['Review video','Get a second opinion'] ];
      return [ ['Write a caption','For this image'], ['Draft a post','Start from this image'], ['Find similar assets','Explore your library'], ['Organize asset','Move into a folder'] ];
    }
    function gallery(s) {
      return `<main class="gf-library"><div class="gf-library-top"><h2>All assets</h2>${s.closed ? '<button type="button" class="gf-quiet" data-do="open">Open agent</button>' : ''}</div><p class="gf-hint">Select assets to change the agent’s context.</p><div class="gf-count">${s.selected.length ? `${s.selected.length} selected <button type="button" class="gf-link" data-do="clear">Clear</button>` : '4 assets'}</div><div class="gf-gallery">${assets.map(a => `<button type="button" class="gf-asset" data-asset="${a.id}" aria-label="${esc(a.name)}, ${a.type}, ${s.selected.includes(a.id) ? 'selected' : 'not selected'}" aria-pressed="${s.selected.includes(a.id)}"><span class="gf-thumb" style="${imageStyle(a)}">${s.selected.includes(a.id) ? '<span class="gf-check" aria-hidden="true">✓</span>' : ''}${a.duration ? `<span class="gf-duration">${a.duration}</span>` : ''}</span><span class="gf-asset-title">${a.name}</span><span class="gf-asset-meta">${a.type} · ${a.meta}</span></button>`).join('')}</div></main>`;
    }
    function head(label='Agent') { return `<header class="gf-agent-head"><strong>${label}</strong><button type="button" class="gf-quiet" data-do="full">Full page ↗</button><button type="button" class="gf-quiet" data-do="close">Close</button></header>`; }
    function cards(s) { return `<div class="gf-actions">${actions(s).map(([title, sub]) => `<button type="button" class="gf-action" data-action="${title}"><strong>${title}</strong><span>${sub}</span></button>`).join('')}</div>`; }
    function transcript(s, showNew = true) {
      return `<div class="gf-thread-title"><span>${esc(s.title)}</span>${showNew ? '<button type="button" class="gf-link" data-do="new">New chat</button>' : ''}</div><div class="gf-transcript">${s.messages.map(m => `<div class="gf-message ${m.who === 'You' ? 'gf-user' : ''}"><strong>${m.who}</strong><p>${esc(m.text)}</p>${m.context ? `<div class="gf-message-context">${esc(m.context)}</div>` : ''}</div>`).join('')}</div>`;
    }
    function welcome(s, variant) {
      const n = s.include ? s.selected.length : 0;
      const title = n > 1 ? 'Make more from this set.' : n ? `Work with this ${selectedAssets(s)[0].type.toLowerCase()}.` : 'What’s next?';
      return `<div class="gf-intro"><div class="gf-eyebrow">${n ? `${n} ${n === 1 ? 'asset' : 'assets'} selected` : 'Your library'}</div><h3>${title}</h3><p class="gf-support">${n ? 'Start with an action or ask in your own words.' : 'Find, organize, or create from what’s here.'}</p>${cards(s)}</div>${variant === 2 ? '<div class="gf-inline-history"><div class="gf-section-label">CONTINUE A CONVERSATION</div><button type="button" class="gf-chats" data-do="recent"><strong>Launch week posts</strong><span>3 drafts · Today</span></button></div>' : ''}`;
    }
    function sources(s) {
      const picked = selectedAssets(s);
      return `<h3>What the agent can see</h3><p class="gf-support">Your current page and the assets you choose.</p><div class="gf-section-label">CURRENT PAGE</div><div class="gf-row"><div class="gf-row-text"><strong>Library / All assets</strong><span>Genfeed.Ai</span></div><span class="gf-eyebrow">Included</span></div><div class="gf-section-label">SELECTION${picked.length ? ` · ${picked.length}` : ''}</div>${picked.length ? picked.map(a => `<div class="gf-row"><div class="gf-mini" style="${imageStyle(a)}"></div><div class="gf-row-text"><strong>${a.name}</strong><span>${a.type} · ${a.meta}</span></div><button type="button" class="gf-quiet" data-asset="${a.id}" aria-label="Remove ${a.name} from selection">Remove</button></div>`).join('') : '<p class="gf-support" style="margin-top:12px">Select an asset in the Library to include it here.</p>'}<div class="gf-section-label">BRAND</div><div class="gf-row"><div class="gf-row-text"><strong>Genfeed.Ai</strong><span>Brand voice and guidelines</span></div></div>${picked.length ? `<button type="button" class="gf-link" style="margin-top:17px" data-do="include">${s.include ? 'Use page only for the next message' : 'Include selection for the next message'}</button>` : ''}`;
    }
    function history(s) {
      return `<h3>Your conversations</h3><p class="gf-support">Pick up where you left off.</p>${s.messages.length ? '<button type="button" class="gf-chats" data-do="current"><strong>Current conversation</strong><span>Just now</span></button>' : ''}<button type="button" class="gf-chats" data-do="recent"><strong>Launch week posts</strong><span>3 drafts · Today</span></button><button type="button" class="gf-chats" data-do="recent2"><strong>Organize product assets</strong><span>Library cleanup · Yesterday</span></button>${s.messages.length ? '<button type="button" class="gf-link" style="margin-top:19px" data-do="new">New chat</button>' : ''}`;
    }
    function composer(s, i) {
      return `<footer class="gf-agent-foot"><div class="gf-input-context">Using: ${esc(context(s))}</div><form class="gf-compose"><textarea aria-label="Message the agent" data-draft placeholder="${s.selected.length && s.include ? 'Ask about your selection…' : 'Ask about your library…'}" rows="2">${esc(s.draft)}</textarea><div class="gf-compose-row"><div class="gf-more-wrap"><button type="button" class="gf-quiet" data-do="attach" aria-expanded="${s.menu === 'attach'}">Attach</button>${s.menu === 'attach' ? '<div class="gf-menu"><button type="button" data-do="pick">Select assets from Library</button><p class="gf-eyebrow">Selected assets are attached automatically.</p></div>' : ''}</div><div class="gf-more-wrap"><button type="button" class="gf-quiet" data-do="more" aria-expanded="${s.menu === 'more'}">More</button>${s.menu === 'more' ? `<div class="gf-menu"><label for="gf-mode-${i}">Response mode</label><select id="gf-mode-${i}" data-mode>${['Auto','Plan'].map(mode => `<option ${s.mode === mode ? 'selected' : ''}>${mode}</option>`).join('')}</select>${s.draft.trim() ? '<button type="button" data-do="improve">Improve this prompt</button>' : ''}</div>` : ''}</div><button type="submit" class="gf-send" ${s.draft.trim() ? '' : 'disabled'}>Send</button></div></form></footer>`;
    }
    function agent(s, i) {
      const picked = selectedAssets(s);
      if (i === 1) {
        return `<aside class="gf-agent gf-inspector">${head(picked.length > 1 ? `${picked.length} selected assets` : picked.length ? 'Selected asset' : 'Library assistant')}<div class="gf-tabs" role="tablist" aria-label="Inspector views">${['Actions','Details','History'].map(tab => `<button type="button" class="gf-tab" role="tab" id="gf-tab-${i}-${tab}" aria-controls="gf-panel-${i}" aria-selected="${(s.tab === 'Chat' ? 'Actions' : s.tab) === tab}" data-tab="${tab}">${tab}</button>`).join('')}</div><div class="gf-pane" id="gf-panel-${i}" role="tabpanel" aria-labelledby="gf-tab-${i}-${s.tab === 'Chat' ? 'Actions' : s.tab}">${s.tab === 'Details' ? sources(s) : s.tab === 'History' ? history(s) : s.messages.length ? transcript(s) : `${picked.length ? `<div class="gf-inspector-preview" style="${imageStyle(picked[0])}"></div>` : ''}<div class="gf-eyebrow">${picked.length === 1 ? `${picked[0].type} · ${picked[0].meta}` : picked.length ? 'Selection in Library' : 'Library / All assets'}</div><h3>${picked.length === 1 ? picked[0].name : picked.length ? 'Work with your selection' : 'Work with your library'}</h3><div class="gf-section-label">WHAT WOULD YOU LIKE TO DO?</div>${actions(s).map(([title]) => `<button type="button" class="gf-command" data-action="${title}">${title}<span aria-hidden="true">↗</span></button>`).join('')}`}</div>${composer(s,i)}</aside>`;
      }
      if (i === 2) {
        return `<aside class="gf-agent gf-conversation">${head()}<div class="gf-thread-tabs" role="tablist" aria-label="Open conversations"><button type="button" class="gf-thread-tab" role="tab" aria-selected="${s.chat === 'new'}" data-do="current">${s.chat === 'new' && s.messages.length ? 'Current chat' : 'New chat'}</button><button type="button" class="gf-thread-tab" role="tab" aria-selected="${s.chat === 'recent'}" data-do="recent">Launch posts</button><button type="button" class="gf-quiet" data-do="new" aria-label="Start a new chat">+ New</button></div><div class="gf-context-strip"><span>${esc(context(s))}</span><button type="button" class="gf-quiet" data-do="context">${s.tab === 'Context' ? 'Back to chat' : 'Context'}</button></div><div class="gf-pane">${s.tab === 'Context' ? sources(s) : s.messages.length ? transcript(s, false) : welcome(s,i)}</div>${composer(s,i)}</aside>`;
      }
      return `<aside class="gf-agent">${head()}<div class="gf-tabs" role="tablist" aria-label="Agent views">${['Chat','Context','History'].map(tab => `<button type="button" class="gf-tab" role="tab" id="gf-tab-${i}-${tab}" aria-controls="gf-panel-${i}" aria-selected="${s.tab === tab}" data-tab="${tab}">${tab}${tab === 'Context' && picked.length ? `<small>${picked.length}</small>` : ''}</button>`).join('')}</div><div class="gf-pane" id="gf-panel-${i}" role="tabpanel" aria-labelledby="gf-tab-${i}-${s.tab}">${s.tab === 'Context' ? sources(s) : s.tab === 'History' ? history(s) : s.messages.length ? transcript(s) : welcome(s,i)}</div>${composer(s,i)}</aside>`;
    }
    function fullpage() {
      return `<div class="gf-full"><aside class="gf-full-sidebar"><div class="gf-brand">New Conversation</div><div class="gf-section-label">RECENT</div><div class="gf-chats"><strong>Launch week posts</strong><span>3 drafts · Today</span></div></aside><main class="gf-full-main"><div><button type="button" class="gf-link" data-do="back">← Back to Library sidebar</button></div><div class="gf-full-empty"><h3>Start a chat</h3><p class="gf-support" style="margin:0">Plan content, review drafts, or decide what to do next.</p><div class="gf-full-pills"><span class="gf-full-pill">Schedule today’s posts</span><span class="gf-full-pill">Create content</span><span class="gf-full-pill">Plan publishing</span></div></div><div class="gf-compose"><textarea aria-label="Full-page composer appearance preview" placeholder="Ask for help with content, review, or planning…" readonly></textarea><div class="gf-compose-row"><span class="gf-full-note">Full-page layout · appearance preview</span><span class="gf-quiet" style="margin-left:auto">Auto</span></div></div></main></div>`;
    }
    function render(i) {
      const s = state[i];
      variants[i].querySelector('.gf-mount').innerHTML = `<div class="gf-window"><header class="gf-top"><span class="gf-mark" aria-label="Genfeed">G</span><span class="gf-brand">Genfeed.Ai</span><span class="gf-crumb">Library / Assets</span><span class="gf-demo">Prototype</span></header>${s.full ? fullpage() : `<div class="gf-workspace ${s.closed ? 'gf-no-agent' : ''}"><nav class="gf-nav" aria-label="Library"><div class="gf-nav-item">New task</div><div class="gf-nav-item">Search</div><div class="gf-nav-label">LIBRARY</div><div class="gf-nav-item">Overview</div><div class="gf-nav-item is-active">Assets</div><div class="gf-nav-item">References</div><div class="gf-nav-label">FOLDERS</div><div class="gf-nav-item">All assets</div><div class="gf-nav-item">Product launch</div></nav>${gallery(s)}${s.closed ? '' : agent(s,i)}</div>`}</div><div class="gf-state" aria-live="polite"><span>Simulated actions · no changes saved</span><span>View: ${s.full ? 'Full page' : s.closed ? 'Library' : s.tab}</span><span>Selection: ${s.selected.length}</span><span>Mode: ${s.mode}</span></div>`;
    }
    function send(i, text) {
      const s = state[i];
      if (!text.trim()) return;
      const used = context(s);
      const names = selectedAssets(s).map(a => a.name).join(', ');
      const response = /caption|post/i.test(text) ? `Good stories start with the details. A look at the care, craft, and people behind what we make.\n\n${s.selected.length && s.include ? `Draft based on ${names}.` : 'Draft based on your Library.'}` : /clip/i.test(text) ? 'I’d start with the making process, then end on the finished piece. In the real agent, this would open a clip draft for you to review.' : /organize/i.test(text) ? `I’d group ${s.selected.length && s.include ? 'these assets' : 'recent assets'} in a “Product launch” folder. In the real agent, you’d review the move before it is applied.` : /compare/i.test(text) ? 'The making process gives you the strongest story; the finished piece gives you the clearest product shot. I’d use them together as a before-and-after sequence.' : `I’ll work with ${used}. In the real agent, this would start “${text}” with that context.`;
      s.messages.push({who:'You', text, context:`Used: ${used}`}, {who:'Agent',text:s.mode === 'Plan' ? `Here’s the plan:\n1. Review ${used}.\n2. ${text}.\n3. Let you review the result before applying it.` : response});
      s.title = text.length > 34 ? text.slice(0,34) + '…' : text;
      s.draft = ''; s.tab = 'Chat'; s.menu = '';
      render(i);
    }
    variants.forEach((variant,i) => {
      render(i);
      variant.addEventListener('input', event => {
        if (!event.target.matches('[data-draft]')) return;
        state[i].draft = event.target.value;
        variant.querySelector('.gf-send').disabled = !event.target.value.trim();
      });
      variant.addEventListener('change', event => {
        if (event.target.matches('[data-mode]')) { state[i].mode = event.target.value; render(i); }
      });
      variant.addEventListener('submit', event => { event.preventDefault(); send(i,state[i].draft); });
      variant.addEventListener('keydown', event => {
        if (event.target.matches('[data-draft]') && event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); send(i,state[i].draft); }
      });
      variant.addEventListener('click', event => {
        const button = event.target.closest('button');
        if (!button) return;
        const s = state[i];
        if (button.dataset.asset) {
          const id = button.dataset.asset;
          s.selected = s.selected.includes(id) ? s.selected.filter(x => x !== id) : [...s.selected,id];
          s.include = true;
        } else if (button.dataset.action) { send(i,button.dataset.action); return; }
        else if (button.dataset.tab) s.tab = button.dataset.tab === 'Actions' ? 'Chat' : button.dataset.tab;
        else switch (button.dataset.do) {
          case 'clear': s.selected = []; break;
          case 'close': s.closed = true; break;
          case 'open': s.closed = false; break;
          case 'full': s.full = true; break;
          case 'back': s.full = false; break;
          case 'context': s.tab = s.tab === 'Context' ? 'Chat' : 'Context'; break;
          case 'new': s.messages = []; s.savedCurrent = null; s.title = 'New conversation'; s.tab = 'Chat'; s.chat = 'new'; s.draft = ''; break;
          case 'current': if (s.chat !== 'new' && s.savedCurrent) { s.messages = s.savedCurrent.messages; s.title = s.savedCurrent.title; } else if (s.chat !== 'new') { s.messages = []; s.title = 'New conversation'; } s.tab = 'Chat'; s.chat = 'new'; break;
          case 'recent': case 'recent2': if (s.chat === 'new') s.savedCurrent = {messages:s.messages, title:s.title}; s.chat = 'recent'; s.tab = 'Chat'; s.title = button.dataset.do === 'recent' ? 'Launch week posts' : 'Organize product assets'; s.messages = [{who:'You',text:button.dataset.do === 'recent' ? 'Draft three posts for launch week.' : 'Organize the product assets.',context:'Used: Library · All assets'},{who:'Agent',text:button.dataset.do === 'recent' ? 'Your three drafts are ready to review. We can refine the copy, choose assets, or plan when to publish them.' : 'We grouped the product shots and making-of footage into one launch collection.'}]; break;
          case 'include': s.include = !s.include; break;
          case 'more': s.menu = s.menu === 'more' ? '' : 'more'; break;
          case 'attach': s.menu = s.menu === 'attach' ? '' : 'attach'; break;
          case 'pick': s.menu = ''; render(i); variant.querySelector('.gf-asset').focus(); return;
          case 'improve': s.draft = `Using ${context(s)}, ${s.draft.charAt(0).toLowerCase()+s.draft.slice(1)} Keep it concise and match the brand voice.`; s.menu = ''; break;
          default: return;
        }
        render(i);
        if (['attach','more'].includes(button.dataset.do)) variant.querySelector(`[data-do="${button.dataset.do}"]`).focus();
      });
    });
    const design = { radius: 4 };
    if (globalThis.Tweak) {
      const tweak = new Tweak({ container: root, onChange: () => root.style.setProperty('--gf-action-radius', `${design.radius}px`) });
      tweak.addSlider(design, 'radius', { label: 'Action corner radius', min: 0, max: 16, step: 1, unit: 'px' });
    }
  })();
  </script>
</div>
