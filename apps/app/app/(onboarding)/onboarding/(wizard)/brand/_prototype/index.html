const icons={grid:'<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/>',bot:'<rect x="4" y="7" width="16" height="13" rx="3"/><path d="M12 3v4M2 12h2m16 0h2m-14 0h.01M16 12h.01M8 16h8"/>',library:'<path d="M4 4v16m5-16v16M14 4l5-1 4 16-5 1z"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 11h18m-13 4h.01M12 15h.01m4 0h.01"/>',chart:'<path d="M12 3a9 9 0 1 0 9 9h-9V3zM16 3v5h5a7 7 0 0 0-5-5z"/>',more:'<circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/>',help:'<circle cx="12" cy="12" r="9"/><path d="M9 9a3 3 0 0 1 6 0c0 2-3 2-3 4m0 3h.01"/>',chevron:'<path d="m9 5 7 7-7 7"/>',down:'<path d="m8 9 4 4 4-4"/>',check:'<path d="m5 12 4 4L19 6"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',back:'<path d="M20 12H4m6-6-6 6 6 6"/>',search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/>',spark:'<path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5zM20 2v4m-2-2h4"/>',image:'<rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8" cy="8" r="1"/><path d="m21 15-5-5-7 7-3-3-3 3"/>',video:'<rect x="3" y="5" width="13" height="14" rx="2"/><path d="m16 10 5-3v10l-5-3"/>',play:'<path d="m8 5 11 7-11 7z"/>',edit:'<path d="m16 3 5 5-12 12-6 1 1-6zM13 6l5 5"/>',refresh:'<path d="M20 7a9 9 0 1 0 1 8M20 3v5h-5"/>',cloud:'<path d="M6 18a5 5 0 0 1-1-10 7 7 0 0 1 13-1 5.5 5.5 0 0 1 0 11M9 14l3 3 4-5"/>',link:'<path d="m10 13 4-4m-7 8-1 1a4 4 0 0 1-6-6l5-5a4 4 0 0 1 6 0m2 0 1-1a4 4 0 0 1 6 6l-5 5a4 4 0 0 1-6 0" transform="translate(2 1)"/>',bell:'<path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/>',panel:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M15 3v18m-5-13-3 4 3 4"/>',plugin:'<path d="M9 3H4v5a3 3 0 1 1 0 6v6h6a3 3 0 1 1 6 0h5v-6a3 3 0 1 0 0-6V3h-5a3 3 0 1 1-7 0z"/>',expand:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>',close:'<path d="m6 6 12 12M6 18 18 6"/>',info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6m0-10h.01"/>',text:'<path d="M4 5h16M12 5v15M8 20h8"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',heart:'<path d="M20 5c-3-3-6-1-8 1-2-2-5-4-8-1-5 5 3 11 8 15 5-4 13-10 8-15z"/>',settings:'<path d="m10 3-.5 3-3 2-3-.5-1 3L5 13l1 3-1 3 3 2 2-2h4l2 2 3-2-1-3 1-3 3-2-1-3-3 .5-3-2L14 3z"/><circle cx="12" cy="12" r="3"/>'};
const icon=(name)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${icons[name]||icons.spark}</svg>`;
const logo=()=>'<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M21.2 10.3h-8.9v3.9h4.5a5.5 5.5 0 1 1-1.2-6.6l3-3A9.9 9.9 0 1 0 22 12c0-.6 0-1.1-.1-1.7z"/></svg>';
const platformSvg={instagram:'<rect x="4" y="4" width="16" height="16" rx="5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="12" cy="12" r="3.5" fill="none" stroke="currentColor" stroke-width="1.8"/><circle cx="17" cy="7" r="1" fill="currentColor"/>',twitter:'<path d="M18.8 3H22l-7.1 8.1L23.2 22h-6.5l-5.1-6.7L5.8 22H2.5l7.6-8.7L1.2 3h6.6l4.6 6.1L18.8 3zM17.7 20h1.8L6.8 4.9H4.9L17.7 20z" fill="currentColor" transform="translate(1 0) scale(.92)"/>',linkedin:'<rect x="2" y="2" width="20" height="20" rx="3" fill="currentColor"/><path d="M6 10v8m0-12v.1M10 18v-8m0 3c0-5 7-5 7 0v5" stroke="#102237" stroke-width="2.5" fill="none"/>',tiktok:'<path d="M14 3h3c.4 3 2 4 4 4v3a9 9 0 0 1-4-1v8a6 6 0 1 1-6-6v3a3 3 0 1 0 3 3V3z" fill="currentColor"/>'};
const platformNames={instagram:'Instagram',tiktok:'TikTok',twitter:'X',linkedin:'LinkedIn'};
const avatar=(p)=>`<span class="avatar ${p}" title="${platformNames[p]}" role="img" aria-label="${platformNames[p]}"><svg viewBox="0 0 24 24" aria-hidden="true">${platformSvg[p]}</svg></span>`;
const btn=(label,action,kind='',ico='')=>`<button class="btn ${kind}" data-action="${action}">${ico?icon(ico):''}${label}</button>`;
const imageUrl='/prototype-assets/poster.svg';
const videoPoster='/prototype-assets/video-poster.svg';
const videoUrl='/prototype-assets/first-video.mp4';
const drafts=[{id:'post-instagram-01',platform:'instagram',kind:'image',title:'A little less busywork.',format:'Image + caption',ratio:'1:1 · 1080 × 1080',text:'Your next post shouldn’t start with a blank page.\n\nGive Genfeed your brand. Get images, videos, and words that sound like you.\n\nLess busywork. More you.'},{id:'post-tiktok-01',platform:'tiktok',kind:'video',title:'From one idea to everywhere.',format:'Video + caption',ratio:'9:16 · 12 seconds · 720p',text:'Your brand already has a voice. Let’s put it to work.\n\nOne idea. Your images, your video, your next post. All in one place.\n\nMade with Genfeed.'},{id:'post-x-01',platform:'twitter',kind:'image',title:'Your voice, without the blank page.',format:'Image + post',ratio:'1:1 · 1080 × 1080',text:'You built the brand. We’ll help you tell its story.\n\nGenfeed turns one idea into images, videos, and posts in your voice.\n\nLess blank-page staring. More putting your work out there.'},{id:'post-linkedin-01',platform:'linkedin',kind:'text',title:'A better place to start.',format:'Text post',ratio:'Brand voice · 67 words',text:'The best part of your brand isn’t how often you post. It’s what you have to say.\n\nGenfeed brings your brand context, ideas, and content into one workspace. Start with what you know. Leave with something worth sharing.\n\nYour voice stays yours. The busywork gets smaller.'}];
const fixtureKey='genfeed-onboarding-PROTOTYPE-wipe-me-v1';
const params=new URLSearchParams(location.search);
const variants=['A','B','C'];
const variantNames={A:'Media gallery',B:'Focused review',C:'Content queue'};
let variant=variants.includes(params.get('variant'))?params.get('variant'):'A';
let selected=0,showState=false,toastTimer,progressTimer;
const fresh=()=>({fixture:'PROTOTYPE — wipe me',runId:'starter-demo-001',phase:'review',scenario:'ready',jobs:{image:'complete',video:'complete',copy:'complete'},generationRequests:1,creditsSpent:12,restored:false,verdicts:{},edits:{},current:0,connected:[]});
function restore(){try{const saved=JSON.parse(localStorage.getItem(fixtureKey));if(saved?.fixture==='PROTOTYPE — wipe me'&&saved.runId==='starter-demo-001'&&saved.jobs&&saved.verdicts&&saved.edits&&Array.isArray(saved.connected)){return {...fresh(),...saved,restored:true};}}catch{}return fresh();}
let state=restore();
selected=Number.isInteger(state.current)&&state.current>=0&&state.current<drafts.length?state.current:0;
function save(){state.current=selected;try{localStorage.setItem(fixtureKey,JSON.stringify(state));}catch{notify('Browser storage is unavailable. This preview cannot demonstrate refresh recovery.');}}
function notify(text){const el=document.getElementById('toast');el.innerHTML=icon('check')+escapeHtml(text);el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),4200);}
function escapeHtml(value){return String(value).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function caption(draft){return state.edits[draft.id]??draft.text;}
function kept(){return Object.values(state.verdicts).filter(v=>v==='keep').length;}
function failed(d){return d.kind==='video'&&state.jobs.video==='failed';}
function postHeader(d){return `<div class="post-header">${avatar(d.platform)}<div><span class="name">Genfeed</span><small>@genfeedai</small></div>${state.verdicts[d.id]==='keep'?`<span class="kept-dot">${icon('check')}Kept</span>`:`<span class="saved">${icon('cloud')}</span>`}</div>`;}
function media(d,large=false){if(failed(d))return `<div class="error-media">${icon('video')}<h3>Your video needs another try</h3><p>The video didn’t finish. Your image and posts are saved.</p>${btn('Retry video · 4 demo GEN','retry-video','small','refresh')}<small class="muted">Only the failed video will run again.</small></div>`;if(d.kind==='text')return `<div class="post-body"><div class="format">${icon('text')}TEXT POST</div><p>${escapeHtml(caption(d))}</p></div>`;return `<div class="creative ${d.kind==='video'?'portrait':''}"><span class="format-tag">${d.kind==='video'?'VIDEO · 9:16':'IMAGE · 1:1'}</span>${d.kind==='video'?`<video controls playsinline preload="metadata" poster="${videoPoster}" aria-label="Play the demo onboarding video"><source src="${videoUrl}" type="video/mp4"></video>`:`<img src="${imageUrl}" alt="Demo brand image: Your ideas. Your voice. Everywhere. An orange sculptural loop on a dark background." loading="eager">`}${!large?`<button class="icon-btn expand" data-action="expand:${drafts.indexOf(d)}" aria-label="Expand ${platformNames[d.platform]} ${d.kind}">${icon('expand')}</button>`:''}</div>`;}
function verdictControls(d){return `<div class="post-footer"><button class="btn small" data-action="keep:${d.id}" aria-pressed="${state.verdicts[d.id]==='keep'}">${icon(state.verdicts[d.id]==='keep'?'check':'heart')}${state.verdicts[d.id]==='keep'?'Keep this':'I’d post this'}</button><button class="icon-btn" data-action="edit:${drafts.indexOf(d)}" aria-label="Edit ${platformNames[d.platform]} caption" title="Edit caption">${icon('edit')}</button></div>`;}
function card(d,compact=false){return `<article class="post-card ${compact?'text-card':''}">${postHeader(d)}${d.kind==='text'?media(d):compact?`<div class="image-small"><img src="${imageUrl}" alt="Saved demo brand image"></div>`:media(d)}${d.kind!=='text'?`<div class="post-body"><div class="format">${icon(d.kind==='video'?'video':'image')}${d.kind==='video'?'12-second video':'Brand image'} <span>· Saved to Library</span></div><p>${escapeHtml(caption(d))}</p></div>`:''}${verdictControls(d)}</article>`;}
function VariantA(){return `<div class="section-line"><div class="flex"><span>Your first collection</span><span class="pill">${state.jobs.video==='failed'?'3 of 4 ready':'4 drafts · 2 media assets'}</span></div><span class="status-label">${icon('cloud')} Saved to your Library</span></div><div class="gallery">${card(drafts[0])}${card(drafts[1])}<div class="stacked">${card(drafts[2],true)}${card(drafts[3],true)}</div></div>`;}
function VariantB(){const d=drafts[selected];return `<div class="section-line"><span>Review ${selected+1} of ${drafts.length}</span><div class="flex">${btn('Previous','previous-post','ghost small','back')}${btn('Next','next-post','ghost small','arrow')}</div></div><div class="focus-layout"><div class="focus-stage">${media(d,true)}</div><div class="focus-info">${postHeader(d)}<div><h2>${escapeHtml(d.title)}</h2><p class="muted" style="font-size:12px;margin-top:5px">${d.ratio}</p></div>${d.kind!=='text'?`<div style="flex:1"><label for="caption-editor">Caption · click to edit</label><textarea id="caption-editor" data-caption="${d.id}">${escapeHtml(caption(d))}</textarea></div>`:`<div class="muted" style="font-size:12px">${btn('Edit this post',`edit-text:${d.id}`,'small','edit')}</div>`}<div class="detail-line"><span>${icon('cloud')} Original result saved</span><span>No new credits used</span></div>${verdictControls(d)}</div></div><div class="filmstrip" role="tablist" aria-label="Drafts">${drafts.map((p,i)=>`<button role="tab" aria-selected="${selected===i}" data-action="select:${i}"><img src="${p.kind==='video'?videoPoster:imageUrl}" alt="">${avatar(p.platform)}<span>${p.kind==='video'?'Video':p.kind==='text'?'Post':'Image'}<br><small>${state.verdicts[p.id]==='keep'?'Kept':failed(p)?'Needs retry':'Ready to review'}</small></span></button>`).join('')}</div>`;}
function VariantC(){const d=drafts[selected];return `<div class="queue-layout"><div><div class="queue-heading"><span>Content · ${drafts.length} drafts</span><span>Review status</span></div><div class="queue">${drafts.map((p,i)=>`<button class="queue-row ${selected===i?'selected':''}" data-action="select:${i}" aria-pressed="${selected===i}"><span class="thumb"><img src="${p.kind==='video'?videoPoster:imageUrl}" alt="">${avatar(p.platform)}</span><span><h3>${escapeHtml(p.title)}</h3><p>${p.format}</p></span><span class="row-end"><span class="${state.verdicts[p.id]==='keep'?'saved':'muted'}">${state.verdicts[p.id]==='keep'?'✓ Kept':failed(p)?'Needs retry':'To review'}</span>${icon('chevron')}</span></button>`).join('')}</div><div class="queue-note">${icon('cloud')}<p>All finished content is in your Library.<br>Pick up here whenever you’re ready.</p></div><div style="margin-top:28px">${btn('Keep all ready drafts','keep-all','','check')}</div></div><article class="queue-preview">${postHeader(d)}${media(d)}${d.kind!=='text'?`<div class="post-body"><p>${escapeHtml(caption(d))}</p></div>`:''}${verdictControls(d)}</article></div>`;}
function working(){return `<div class="progress-frame"><div class="progress-icon">${icon('spark')}</div><h2>Your brand is taking shape.</h2><p>Your finished work stays saved, even if you leave this page.</p><div class="loading-grid">${[['image','image','Creating your brand image'],['video','video','Rendering your first video'],['copy','text','Writing in your voice']].map(([key,ico,label])=>`<div class="loading-tile"><div class="flex between">${icon(ico)}<span class="pill">${state.jobs[key]==='complete'?'✓ Saved':'In progress'}</span></div>${state.jobs[key]==='complete'?`<img src="${key==='video'?videoPoster:imageUrl}" alt="Saved demo result" style="width:100%;height:125px;object-fit:cover;margin-top:16px;border-radius:5px">`:'<div class="placeholder"></div>'}<strong>${label}</strong><p>${state.jobs[key]==='complete'?'Ready. You can review this next.':'You can refresh. This job will keep its place.'}</p></div>`).join('')}</div><span class="pill">${icon('clock')} One starter run · using your onboarding credits</span></div>`;}
function brandForm(){return `<div class="form-stage"><div class="eyebrow">01 / Your brand</div><h1>Let’s make something<br>that feels like you.</h1><p>Start with your website. We’ll use your brand’s voice and style to create your first image, video, and posts.</p><label for="website" class="muted" style="display:block;font-size:12px;margin-bottom:10px">Your website</label><form id="brand-form" class="url-input"><input id="website" type="url" value="https://genfeed.ai" placeholder="https://yourbrand.com" required>${btn('Create my first posts','start','primary','arrow')}</form><p class="muted" style="font-size:11px;margin-top:12px">${icon('spark')} Included in your onboarding credits. Nothing publishes automatically.</p><div style="margin-top:14px">${btn('Explore the workspace first','skip','ghost small')}</div><div class="form-examples"><img src="${imageUrl}" alt="Demo brand image preview"><img src="${videoPoster}" alt="Demo video preview"></div></div>`;}
function connect(){return `<div class="connect-stage"><span class="pill">${icon('check')} ${kept()} drafts kept in your Library</span><h1 style="margin-top:20px">Good content. Your call<br>when it goes live.</h1><p>Connect a social account to take your drafts further,<br>or head into your workspace and keep creating.</p><div class="connect-list">${drafts.map(d=>`<div class="connect-row">${avatar(d.platform)}<div><h3>${platformNames[d.platform]}</h3><small>${state.connected.includes(d.platform)?'Demo connection ready':'Connect when you’re ready to publish'}</small></div>${btn(state.connected.includes(d.platform)?'Connected':'Connect',`connect:${d.platform}`,state.connected.includes(d.platform)?'small':'small',state.connected.includes(d.platform)?'check':'link')}</div>`).join('')}</div><p class="note">Connection is simulated in this prototype. Nothing will be published.</p>${btn('Open my workspace','finish','primary','arrow')} ${btn('Back to my drafts','review','ghost')}</div>`;}
function sidebar(){const phase=state.phase;return `<aside class="sidebar" aria-label="Onboarding progress"><div class="search"><span>${icon('search')} Search</span><span>⌘ K</span></div><div class="eyebrow">Getting started</div><button class="step ${phase==='brand'?'active':'done'}" data-action="brand"><span class="number">${phase==='brand'?'1':icon('check')}</span>Your brand</button><button class="step ${phase==='generating'?'active':phase==='review'||phase==='connect'?'done':''}" data-action="working"><span class="number">${phase==='review'||phase==='connect'?icon('check'):'2'}</span>Create your content</button><button class="step ${phase==='review'?'active':phase==='connect'?'done':''}" data-action="review"><span class="number">${phase==='connect'?icon('check'):'3'}</span>Review your drafts</button><button class="step ${phase==='connect'?'active':''}" data-action="continue"><span class="number">4</span>Make it yours</button><div class="sidebar-bottom"><div class="brand-avatar">${logo()}</div><h3>Made for Genfeed</h3><p>genfeed.ai</p><div class="avatar-stack">${drafts.map(d=>avatar(d.platform)).join('')}</div><div class="footer-note"><div class="flex between"><span>Starter credits</span><span>${state.creditsSpent} / 20 GEN</span></div><div class="meter"><span style="width:${Math.min(100,state.creditsSpent/20*100)}%"></span></div><span class="muted" style="font-size:10px">Demo balance · one saved generation</span></div><div class="footer-note">${icon('help')} Need a hand?<br><span class="muted">Your work is saved as you go.</span></div></div></aside>`;}
function render(){const nav=[['grid','Workspace'],['bot','Agent'],['library','Library'],['calendar','Publishing'],['chart','Analytics'],['more','More apps']];document.getElementById('app').innerHTML=`<nav class="rail" aria-label="App navigation"><span class="mark" aria-label="Genfeed">${logo()}</span>${nav.map(([i,label])=>`<button class="icon-btn" data-action="nav:${label}" title="${label}" aria-label="${label}" ${i==='grid'?'aria-current="page"':''}>${icon(i)}</button>`).join('')}<div class="bottom"><button class="icon-btn" data-action="help" aria-label="Help">${icon('help')}</button><span class="account" title="Demo account">V</span></div></nav><header class="topbar"><div class="scope"><span class="brand-avatar">${logo()}</span>Genfeed.ai ${icon('down')}</div><div class="scope"><span class="mark" style="font-size:12px">${logo()}</span>Genfeed ${icon('down')}</div><div class="crumb">Getting started <span>/</span> <strong>${state.phase==='brand'?'Your brand':state.phase==='connect'?'Make it yours':state.phase==='generating'?'Create your content':'Your first posts'}</strong></div><span class="grow"></span><span class="wallet">${20-state.creditsSpent}<small>GEN · DEMO</small></span><button class="icon-btn" data-action="nav:Plugins" aria-label="Plugins">${icon('plugin')}</button><button class="icon-btn" data-action="nav:Notifications" aria-label="Notifications">${icon('bell')}</button><button class="icon-btn" data-action="nav:Agent" aria-label="Open agent">${icon('panel')}</button></header><div class="frame">${sidebar()}<main class="workspace" id="main-content"><div class="page">${state.phase==='brand'?brandForm():state.phase==='connect'?connect():state.phase==='generating'?working():`<header class="heading"><div class="eyebrow">03 / Review your drafts</div><div class="heading-line"><h1>Your brand. Ready to post.</h1><span class="pill saved">${icon('check')} First collection ready</span></div><p>Made from your website, in your voice. Keep what feels right. Make the rest yours.</p><div class="brand-line">${icon('link')} genfeed.ai <span style="color:var(--line)">/</span> Your brand voice <span style="color:var(--line)">/</span> ${state.creditsSpent} onboarding GEN used</div></header>${state.restored?`<div class="restore-banner"><span class="icon">${icon('cloud')}</span><span>Welcome back. Your drafts, media, and choices are right where you left them. <strong style="font-weight:500;color:var(--text)">No extra credits used.</strong></span><button class="icon-btn" data-action="dismiss-restore" aria-label="Dismiss restore notice">${icon('close')}</button></div>`:''}${variant==='A'?VariantA():variant==='B'?VariantB():VariantC()}`}</div></main></div>${state.phase==='review'?`<footer class="actionbar"><div class="summary">${kept()?`${kept()} of ${drafts.length} drafts kept`:'A first collection, made for you'}<small>Nothing is published until you approve it.</small></div><div class="actions">${btn('Open workspace','skip','ghost')}${btn(kept()?`Continue with ${kept()} draft${kept()===1?'':'s'}`:'Continue to workspace','continue','primary','arrow')}</div></footer>`:''}<nav class="prototype-bar" aria-label="Prototype variants"><span class="caption">Prototype · demo media</span><button class="icon-btn" data-action="variant-prev" aria-label="Previous variant">${icon('back')}</button><span class="current">${variant} · ${variantNames[variant]}</span><button class="icon-btn" data-action="variant-next" aria-label="Next variant">${icon('arrow')}</button><span class="sep"></span><button class="plain" data-action="refresh" title="Reload saved demo results">${icon('refresh')} Refresh</button><button class="plain" data-action="state" aria-expanded="${showState}">Scenarios</button></nav>${showState?statePanel():''}`;document.title=`${variant} · ${variantNames[variant]} · Onboarding prototype`;}
function statePanel(){return `<aside class="state-panel" aria-label="Prototype state"><div class="flex between"><h3>Try the flow</h3><button class="icon-btn" data-action="state" aria-label="Close scenarios">${icon('close')}</button></div><p>Isolated browser fixture. No provider calls, real credits, or publishing. Refresh restores the same saved run.</p><div class="scenario-buttons">${btn('Brand input','brand','small')}${btn('Generating','working','small')}${btn('Ready','ready','small')}${btn('Video failed','video-failed','small')}${btn('Refresh page','refresh','small')}${btn('Reset demo','reset','small')}</div><pre aria-label="Saved generation state">${escapeHtml(JSON.stringify({variant,phase:state.phase,runId:state.runId,postIds:drafts.map(d=>d.id),jobs:state.jobs,generationRequests:state.generationRequests,creditsSpent:state.creditsSpent,restored:state.restored,kept:state.verdicts,editedCaptions:state.edits,selectedPost:drafts[selected].id,connectedPlatforms:state.connected},null,2))}</pre></aside>`;}
function switchVariant(delta){variant=variants[(variants.indexOf(variant)+delta+variants.length)%variants.length];const next=new URL(location.href);next.searchParams.set('variant',variant);history.replaceState(null,'',next);render();}
function beginWorking(){clearTimeout(progressTimer);state.phase='generating';state.jobs={image:'complete',video:'running',copy:'complete'};save();render();finishWorkingLater();}
function finishWorkingLater(){clearTimeout(progressTimer);progressTimer=setTimeout(()=>{if(state.phase!=='generating')return;state.jobs={image:'complete',video:'complete',copy:'complete'};state.phase='review';state.restored=false;save();render();notify('Your collection is ready. All results are saved.');},5500);}
function openMedia(index){const d=drafts[index];document.getElementById('modal-root').innerHTML=`<div class="media-modal" role="dialog" aria-modal="true" aria-label="${platformNames[d.platform]} media preview"><button class="icon-btn" data-action="close-modal" aria-label="Close media preview">${icon('close')}</button>${media(d,true)}</div>`;document.querySelector('[data-action="close-modal"]').focus();}
function closeMedia(){document.getElementById('modal-root').innerHTML='';document.querySelector('[data-action="state"]').focus();}
document.addEventListener('click',event=>{const action=event.target.closest('[data-action]')?.dataset.action;if(!action)return;const [kind,value]=action.split(':');if(['brand','working','ready','video-failed','reset'].includes(kind))showState=false;switch(kind){case'variant-prev':switchVariant(-1);return;case'variant-next':switchVariant(1);return;case'state':showState=!showState;render();return;case'keep':state.verdicts[value]=state.verdicts[value]==='keep'?'review':'keep';save();render();return;case'keep-all':drafts.filter(d=>!failed(d)).forEach(d=>state.verdicts[d.id]='keep');save();render();return;case'edit':selected=Number(value);variant='B';{const next=new URL(location.href);next.searchParams.set('variant','B');history.replaceState(null,'',next);}save();render();document.getElementById('caption-editor')?.focus();return;case'edit-text':{const d=drafts[selected];const target=document.querySelector('.focus-info');target.querySelector('[data-action^="edit-text"]').outerHTML=`<textarea id="caption-editor" data-caption="${d.id}" aria-label="Edit LinkedIn post">${escapeHtml(caption(d))}</textarea>`;document.getElementById('caption-editor').focus();return;}case'select':selected=Number(value);save();render();return;case'previous-post':selected=(selected+drafts.length-1)%drafts.length;save();render();return;case'next-post':selected=(selected+1)%drafts.length;save();render();return;case'continue':state.phase=kept()?'connect':'review';if(!kept()){notify('Workspace handoff preview: all 4 drafts are saved in your Library.');return;}save();render();return;case'skip':case'finish':notify('Workspace handoff preview: your drafts and media are saved in the Library. Nothing was published.');return;case'connect':if(!state.connected.includes(value))state.connected.push(value);save();render();notify(`${platformNames[value]} connected in demo mode. No account was contacted.`);return;case'brand':clearTimeout(progressTimer);state.phase='brand';save();render();return;case'start':event.preventDefault();if(!document.getElementById('website').reportValidity())return;beginWorking();return;case'working':beginWorking();return;case'ready':clearTimeout(progressTimer);state.phase='review';state.jobs={image:'complete',video:'complete',copy:'complete'};save();render();return;case'review':state.phase='review';clearTimeout(progressTimer);save();render();return;case'video-failed':clearTimeout(progressTimer);state.jobs.video='failed';state.phase='review';state.scenario='video-failed';save();render();return;case'retry-video':state.generationRequests+=1;state.creditsSpent+=4;beginWorking();notify('Retrying only the failed video. Saved images and posts are reused.');return;case'refresh':save();location.reload();return;case'dismiss-restore':state.restored=false;save();render();return;case'reset':clearTimeout(progressTimer);state=fresh();selected=0;save();render();notify('Demo reset. One starter run, 12 demo GEN used.');return;case'expand':openMedia(Number(value));return;case'close-modal':closeMedia();return;case'help':notify('Prototype: your onboarding progress and drafts stay saved as you explore.');return;case'nav':notify(`${value} opens from this same app frame after onboarding.`);return;}});
document.addEventListener('input',event=>{if(event.target.dataset.caption){state.edits[event.target.dataset.caption]=event.target.value;save();}});
document.addEventListener('submit',event=>{if(event.target.id==='brand-form'){event.preventDefault();beginWorking();}});
document.addEventListener('keydown',event=>{if(event.key==='Escape'&&document.getElementById('modal-root').childElementCount){closeMedia();return;}if(event.target.closest('input,textarea,select,[contenteditable="true"]')||document.getElementById('modal-root').childElementCount||event.altKey||event.ctrlKey||event.metaKey)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();switchVariant(event.key==='ArrowRight'?1:-1);}});
window.addEventListener('popstate',()=>{const next=new URLSearchParams(location.search).get('variant');if(variants.includes(next))variant=next;render();});
window.addEventListener('pagehide',save);
save();render();if(state.phase==='generating')finishWorkingLater();
</script>
</body>
</html>
